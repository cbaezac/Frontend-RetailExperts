      wireDMY();
    })();

    /* ---- Multi-select filtros (visual) ---- */
    var FILTER_DEFS={
      locales:[['Cadena',['Cencosud','Walmart','SMU','Tottus']],['Formato',['Jumbo','Santa Isabel','Hiper Líder','Líder Express','Unimarc','Hiper Tottus']],['Región',['R. Metropolitana','Valparaíso','Biobío','Maule','Coquimbo']],['Código Local',['J101','U101','L101','T101']],['Nombre Local',['Jumbo Peñalolén','Hiper Líder Ñuñoa','Unimarc Peñalolén']]],
      productos:[['Categoría',['Alimentos','Bebidas','Limpieza','Cuidado Personal','Hogar']],['Marca',['Adclean','Bekys','Café Haití','Kuna Foods','Olisur','Prater']],['Código Producto',['SKU1001','SKU1002','SKU1003']],['Descriptor Producto',['Aceite 1L','Detergente 3kg','Café 250g','Shampoo 400ml']],['Estado',['activo','inactivo']]]
    };
    var gFilters={ locales:{}, productos:{} };
    function ms2Esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
    function displayText(label, o){ return label==='Estado' ? o.charAt(0).toUpperCase()+o.slice(1) : o; }
    function buildMultiFilters(){
      ['locales','productos'].forEach(function(grp){
        var host2=document.getElementById(grp==='locales'?'fgLocales':'fgProductos'); if(!host2) return; host2.innerHTML='';
        FILTER_DEFS[grp].forEach(function(def){
          var label=def[0], opts=def[1];
          if(!gFilters[grp][label]) gFilters[grp][label]=[];
          var f=document.createElement('div'); f.className='fb-field';
          var ph='Todos';
          f.innerHTML='<label>'+label+'</label><div class="ms2"><button type="button" class="ms2-btn"><span class="ms2-txt">'+ph+'</span><span class="ms2-cv"><svg width="10" height="10" viewBox="0 0 12 12" fill="none"><path d="M2.5 4.5L6 8l3.5-3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button><div class="ms2-pop"><input type="search" class="ms2-search" placeholder="Buscar" autocomplete="off" /><div class="ms2-list">'+opts.map(function(o){return '<label class="ms2-item" data-text="'+ms2Esc(o).toLowerCase()+'"><input type="checkbox" value="'+ms2Esc(o)+'"><span>'+ms2Esc(displayText(label,o))+'</span></label>';}).join('')+'</div><div class="ms2-empty">Sin coincidencias</div></div></div>';
          host2.appendChild(f);
          var btn=f.querySelector('.ms2-btn'), pop=f.querySelector('.ms2-pop'), txt=f.querySelector('.ms2-txt'), search=f.querySelector('.ms2-search'), empty=f.querySelector('.ms2-empty');
          function syncTxt(){ var sel=gFilters[grp][label]; txt.textContent = sel.length===0?ph:(sel.length===1?displayText(label,sel[0]):sel.length+' seleccionados'); }
          function syncItems(){
            var q=(search.value||'').trim().toLowerCase();
            var shown=0;
            pop.querySelectorAll('.ms2-item').forEach(function(item){
              var c=item.querySelector('input'), ok=!q || (item.getAttribute('data-text')||'').indexOf(q)>=0 || c.checked;
              item.classList.toggle('is-selected', c.checked);
              item.classList.toggle('is-hidden', !ok);
              if(ok) shown++;
            });
            if(empty) empty.classList.toggle('show', shown===0);
          }
          pop.querySelectorAll('input').forEach(function(c){ c.checked = gFilters[grp][label].indexOf(c.value)>=0; });
          syncTxt(); syncItems();
          btn.addEventListener('click', function(e){ e.stopPropagation(); var open=pop.classList.contains('open'); document.querySelectorAll('.ms2-pop.open').forEach(function(p){p.classList.remove('open');}); if(!open){ pop.classList.add('open'); search.focus(); search.select(); syncItems(); } });
          pop.addEventListener('click', function(e){ e.stopPropagation(); });
          search.addEventListener('input', syncItems);
          pop.addEventListener('change', function(){ gFilters[grp][label]=[].slice.call(pop.querySelectorAll('.ms2-item input:checked')).map(function(c){return c.value;}); syncTxt(); syncItems(); });
        });
      });
      applyFieldVisibility(_currentArea);
    }
    document.addEventListener('click', function(){ document.querySelectorAll('.ms2-pop.open').forEach(function(p){p.classList.remove('open');}); });

    /* ---- Favoritos (consultas guardadas por usuario y dashboard) ---- */
    var AREA_LABEL={resumen:'Avance Mensual - Negocio',mapa:'Avance Mensual - Mapa',comercial:'Comercial - Evolutivo',comparativo:'Comercial - Comparativo',forecast:'Comercial - Venta Perdida',abastecimiento:'Operacional - Abastecimiento',osa:'Operacional - OSA',promociones:'Operacional - Promociones',personalizado:'Personalizado - Personalizado'};
    function favUser(){ try{ return localStorage.getItem('re_current_user')||'invitado'; }catch(e){ return 'invitado'; } }
    // Los favoritos persisten en el backend (por usuario) via /web/dashboard/vistas.
    // FAV_CACHE es el espejo en memoria que leen renderFavs/favApply; localStorage
    // (re_dash_favs_cache) queda solo como respaldo offline si la API no responde.
    var FAV_CACHE=null;
    function favMapRemote(v){ var cfg=v.config||{}; return {id:v.id, name:v.nombre, area:v.area, filters:cfg.filters||{}, view:cfg.view||{}, ts:v.ts||0}; }
    function favLocalGet(){ try{ return JSON.parse(localStorage.getItem('re_dash_favs_cache')||'[]'); }catch(e){ return []; } }
    function favLocalSet(list){ try{ localStorage.setItem('re_dash_favs_cache', JSON.stringify(list||[])); }catch(e){} }
    function favLoadRemote(){
      if(!window.RetailAPI){ FAV_CACHE=favLocalGet(); return Promise.resolve(FAV_CACHE); }
      return window.RetailAPI.requestJson('/web/dashboard/vistas').then(function(r){
        FAV_CACHE=(r.vistas||[]).map(favMapRemote); favLocalSet(FAV_CACHE); return FAV_CACHE;
      }).catch(function(){ if(FAV_CACHE==null) FAV_CACHE=favLocalGet(); return FAV_CACHE; });
    }
    function favListAll(){ if(FAV_CACHE==null) FAV_CACHE=favLocalGet(); return FAV_CACHE; }
    function favWriteAll(list){ FAV_CACHE=list||[]; favLocalSet(FAV_CACHE); }
    function favFilterParts(fav){
      var parts=[];
      ['locales','productos'].forEach(function(g){ var o=(fav.filters&&fav.filters[g])||{}; Object.keys(o).forEach(function(k){ if(o[k]&&o[k].length) parts.push(k+': '+o[k].join(', ')); }); });
      return parts;
    }
    function captureView(area){
      var v={};
      if(area==='resumen' || area==='cadena'){ v.resMetric=resMetric; }
      else if(area==='comercial'){ v.ap=comApertura; v.m=comSalesMetric; v.pp=!!comMetrics.precio; }
      else if(area==='comparativo'){ v.ap=cmpApertura; v.m=cmpMetric; }
      else if(area==='abastecimiento'){ v.sort={key:abaCadSort.key,dir:abaCadSort.dir}; }
      else if(area==='proxq'){ v.ap=pqApertura; v.hz=pqHorizon; v.sort={key:pqSort.key,dir:pqSort.dir}; }
      else if(area==='quiebrescadena'){ v.ap=pqApertura; v.sort={key:pqSort.key,dir:pqSort.dir}; }
      else if(area==='cpfr'){ v.st=cpfrStatusFilter; v.sort={key:cpfrSort.key,dir:cpfrSort.dir}; }
      else if(area==='fore'){ v.ap=fsApertura; v.hz=fsHorizon; v.sort={key:fsSort.key,dir:fsSort.dir}; }
      else if(area==='forecast'){ v.line=fcLineMetric; v.sort={key:fcSort.key,dir:fcSort.dir}; }
      else if(area==='personalizado'){ v.charts=JSON.parse(JSON.stringify(pzCharts.map(function(c){ return {type:c.type,mode:c.mode,gran:c.gran,ap:c.ap,inds:c.inds,filters:c.filters,sort:c.sort}; }))); v.applied=pzApplied; }
      return v;
    }
    function applyView(area,v){
      if(!v) return;
      if(area==='resumen' || area==='cadena'){ if(v.resMetric)resMetric=v.resMetric; }
      else if(area==='comercial'){ if(v.ap)comApertura=v.ap; if(v.m)comSalesMetric=v.m; comMetrics.precio=!!v.pp; comDrill=[]; }
      else if(area==='comparativo'){ if(v.ap)cmpApertura=v.ap; if(v.m)cmpMetric=v.m; cmpDrill=[]; }
      else if(area==='abastecimiento'){ if(v.sort){abaCadSort={key:v.sort.key,dir:v.sort.dir};} abaDrill=[]; }
      else if(area==='proxq'){ if(v.ap)pqApertura=v.ap; if(v.hz)pqHorizon=v.hz; if(v.sort){pqSort={key:v.sort.key,dir:v.sort.dir};} }
      else if(area==='quiebrescadena'){ if(v.ap)pqApertura=v.ap; if(v.sort){pqSort={key:v.sort.key,dir:v.sort.dir};} }
      else if(area==='cpfr'){ if(v.st)cpfrStatusFilter=v.st; if(v.sort){cpfrSort={key:v.sort.key,dir:v.sort.dir};} }
      else if(area==='fore'){ if(v.ap)fsApertura=v.ap; if(v.hz)fsHorizon=v.hz; if(v.sort){fsSort={key:v.sort.key,dir:v.sort.dir};} }
      else if(area==='forecast'){ if(v.line)fcLineMetric=v.line; if(v.sort){fcSort={key:v.sort.key,dir:v.sort.dir};} fcDrill=[]; }
      else if(area==='personalizado'){
        if(v.charts){ pzCharts=JSON.parse(JSON.stringify(v.charts)).map(function(c){ c.drill=[]; c.sort=c.sort||{key:(c.inds&&c.inds[0])||'vp',dir:-1}; c.filters=c.filters||{}; return c; }); pzApplied=(v.applied!==false)&&pzCharts.length>0; pzStage=pzCharts.length?'done':'type'; pzDraft=null; pzEditIdx=-1; }
        else if(v.mode){ pzCharts=[{type:'matriz',mode:v.mode,gran:v.gran||'semanal',ap:v.ap||'cadena',inds:(v.inds||['vp']).slice(),filters:v.pf?JSON.parse(JSON.stringify(v.pf)):{},drill:[],sort:{key:(v.inds&&v.inds[0])||'vp',dir:-1}}]; pzApplied=true; pzStage='done'; pzDraft=null; pzEditIdx=-1; }
      }
    }
    function applyFilters(fs){ gFilters={ locales:JSON.parse(JSON.stringify((fs&&fs.locales)||{})), productos:JSON.parse(JSON.stringify((fs&&fs.productos)||{})) }; buildMultiFilters(); }
    function favCurrentArea(){ var t=document.querySelector('.tab.on'); return t?t.getAttribute('data-area'):'resumen'; }
    function favApply(fav){
      var area=fav.area||'resumen';
      applyFilters(fav.filters); applyView(area, fav.view);
      document.querySelectorAll('#tabs .tab').forEach(function(x){ x.classList.toggle('on', x.getAttribute('data-area')===area); });
      showArea(area); renderFavs();
    }
    function favSaveCurrent(){
      var area=favCurrentArea();
      openFavModal('Guardar favorito', '', function(name){
        var config={ filters:JSON.parse(JSON.stringify(gFilters)), view:captureView(area) };
        var done=function(fav){ favListAll().push(fav); favLocalSet(FAV_CACHE); renderFavs(); openFavManager(); };
        window.RetailAPI.requestJson('/web/dashboard/vistas', {method:'POST', body:JSON.stringify({nombre:name, area:area, config:config})})
          .then(function(v){ done(favMapRemote(v)); })
          .catch(function(){ done({ id:null, name:name, area:area, filters:config.filters, view:config.view, ts:Date.now() }); });
      });
    }
    function favRename(idx){
      var list=favListAll(); var fav=list[idx]; if(!fav) return;
      openFavModal('Renombrar favorito', fav.name, function(name){
        fav.name=name; favLocalSet(FAV_CACHE); renderFavs(); openFavManager();
        if(fav.id!=null) window.RetailAPI.requestJson('/web/dashboard/vistas/'+fav.id, {method:'PATCH', body:JSON.stringify({nombre:name})}).catch(function(){});
      });
    }
    function favDelete(idx){
      var list=favListAll(); var fav=list[idx]; if(!fav) return; list.splice(idx,1); favLocalSet(FAV_CACHE); renderFavs(); openFavManager();
      if(fav.id!=null) window.RetailAPI.requestJson('/web/dashboard/vistas/'+fav.id, {method:'DELETE'}).catch(function(){});
    }

    /* ---- Modal nombre ---- */
    function openFavModal(title, current, onSave){
      var ov=document.getElementById('favModal');
      ov.querySelector('.favm-title').textContent=title;
      var inp=ov.querySelector('#favmInput'); inp.value=current||'';
      ov.classList.add('open'); setTimeout(function(){ inp.focus(); inp.select(); }, 30);
      function close(){ ov.classList.remove('open'); ok.onclick=null; cancel.onclick=null; inp.onkeydown=null; }
      var ok=ov.querySelector('#favmOk'), cancel=ov.querySelector('#favmCancel');
      function save(){ var v=inp.value.trim(); if(!v){ inp.focus(); return; } close(); onSave(v); }
      ok.onclick=save; cancel.onclick=close;
      inp.onkeydown=function(e){ if(e.key==='Enter') save(); if(e.key==='Escape') close(); };
      ov.onclick=function(e){ if(e.target===ov) close(); };
    }
    /* ---- Gestor de favoritos ---- */
    function openFavManager(){
      var list=favListAll();
      var ov=document.getElementById('favMgr');
      ov.querySelector('.favmgr-sub').textContent='Todos los dashboards · '+favUser();
      var body=ov.querySelector('#favMgrBody');
      if(!list.length){ body.innerHTML='<p class="favmgr-empty">Aún no has guardado favoritos.</p>'; }
      else {
        body.innerHTML=list.map(function(fav,i){
          var d=new Date(fav.ts); var ds=('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+'/'+d.getFullYear();
          var parts=favFilterParts(fav);
          var filtxt=parts.length?parts.join(' · '):'Sin filtros';
          var areaChip='<span style="display:inline-flex;align-items:center;font-family:var(--font-display);font-weight:700;font-size:.6rem;text-transform:uppercase;letter-spacing:.05em;color:var(--purple);background:var(--purple-soft);border-radius:999px;padding:2px 8px;flex:0 0 auto">'+(AREA_LABEL[fav.area]||fav.area||'—')+'</span>';
          return '<div class="favmgr-row" data-i="'+i+'"><div class="favmgr-info"><span class="favmgr-name" style="display:inline-flex;align-items:center;gap:7px;flex-wrap:wrap">'+fav.name+' '+areaChip+'</span><span class="favmgr-meta" title="'+filtxt.replace(/"/g,'&quot;')+'">'+filtxt+'</span><span class="favmgr-meta">Guardado '+ds+'</span></div>'
            + '<div class="favmgr-acts"><button type="button" class="favmgr-apply" data-i="'+i+'">Aplicar</button>'
            + '<button type="button" class="favmgr-edit" data-i="'+i+'" title="Renombrar"><svg viewBox="0 0 24 24" fill="none"><path d="M4 20h4L18 10a2 2 0 0 0-2.8-2.8L5 17.4V20Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="m13.5 6.5 4 4" stroke="currentColor" stroke-width="1.8"/></svg></button>'
            + '<button type="button" class="favmgr-del" data-i="'+i+'" title="Eliminar"><svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m1 0-1 13a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1L6 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div></div>';
        }).join('');
        body.querySelectorAll('.favmgr-apply').forEach(function(b){ b.onclick=function(){ favApply(list[+b.getAttribute('data-i')]); ov.classList.remove('open'); }; });
        body.querySelectorAll('.favmgr-edit').forEach(function(b){ b.onclick=function(){ favRename(+b.getAttribute('data-i')); }; });
        body.querySelectorAll('.favmgr-del').forEach(function(b){ b.onclick=function(){ favDelete(+b.getAttribute('data-i')); }; });
      }
      ov.classList.add('open');
      ov.querySelector('#favMgrClose').onclick=function(){ ov.classList.remove('open'); };
      ov.querySelector('#favMgrSave').onclick=function(){ ov.classList.remove('open'); favSaveCurrent(); };
      ov.onclick=function(e){ if(e.target===ov) ov.classList.remove('open'); };
    }
    function renderFavs(){
      var host2=document.getElementById('favBar'); if(!host2) return;
      var area=favCurrentArea(); var list=favListAll();
      var favBtnsHtml='<button type="button" class="fav-save" id="favSaveBtn"><svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg> Guardar favorito</button>'
        + '<button type="button" class="fav-manage" id="favMgrBtn"><svg viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg> Ver favoritos'+(list.length?' ('+list.length+')':'')+'</button>';
      if(area==='mapa'){
        // Mantener la misma altura: botones invisibles + mensaje centrado encima
        host2.innerHTML='<div style="position:relative;display:flex;flex-direction:column;gap:6px;flex:1 1 auto"><div style="visibility:hidden;display:flex;flex-direction:column;gap:6px">'+favBtnsHtml+'</div>'
          + '<span class="fav-empty" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;margin:0">No disponible en Mapa</span></div>';
        return;
      }
      host2.innerHTML=favBtnsHtml;
      document.getElementById('favSaveBtn').addEventListener('click', favSaveCurrent);
      document.getElementById('favMgrBtn').addEventListener('click', openFavManager);
    }

    function startDashboard(){
      setDataBadge(true);
      setTimeout(function(){ buildMultiFilters(); showArea('resumen'); renderFavs(); favLoadRemote().then(renderFavs); }, 0);
    }
    if (IS_INTERNAL && !CLIENTE_ID) {
      showClientGate(startDashboard);
    } else {
      if (IS_INTERNAL) renderClienteBadge(sessionStorage.getItem(CLIENTE_KEY + '_nombre'));
      startDashboard();
    }
